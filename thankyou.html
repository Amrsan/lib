
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You</title>
  <style>
    body { font-family: Arial; background-color: #e0f7e0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .message-box { background: white; padding: 40px; border-radius: 10px; text-align: center; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .message-box h1 { color: #4CAF50; }
    .message-box p { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="message-box">
    <h1>Thank You!</h1>
    <p>Your order has been received. We'll contact you soon.</p>
  </div>
  <script>
    window.onload = function () {
      // Clear the cart data from localStorage
      localStorage.removeItem('selectedBookTitle');
      localStorage.removeItem('selectedBookImg');
      localStorage.removeItem('selectedBookPrice');
      localStorage.removeItem('selectedBookAuthor');
      localStorage.removeItem('selectedBookDescription');
      
      history.pushState(null, "", window.location.href);
      window.addEventListener('popstate', function(){
        window.location.href = 'home.html'; // Redirect to home page
      });
    };
  </script>
</body>
</html>
