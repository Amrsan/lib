
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout</title>
  <style>
    body { font-family: Arial; background-color: #f9f9f9; padding: 20px; }
    .form-box { background: white; padding: 20px; max-width: 600px; margin: auto; border-radius: 8px; }
    input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
    .checkout-btn { width: 100%; padding: 15px; background-color: #4CAF50; color: white; border: none; font-size: 16px; }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Enter Your Details</h2>
    <form>
      <input type="text" placeholder="Full Name" required />
      <input type="text" placeholder="Address" required />
      <input type="text" placeholder="City" required />
      <input type="text" placeholder="Phone Number" required />
      <input type="email" placeholder="Email" required />
      <select required>
        <option value="">Select Payment Method</option>
        <option>Visa</option>
        <option>InstaPay</option>
        <option>Cash on Delivery</option>
      </select>
      <button class="checkout-btn" type="submit" formaction="thankyou.html">Purchase</button>
    </form>
  </div>
</body>
</html>
