<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مكتبة عبودي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        form {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            text-align: center;
            color: #1e5631;
            margin-bottom: 20px;
        }
        
        .container {
            display: flex;
            flex-direction: column;
        }
        
        input[type="text"],
        input[type="password"] {
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #3e8e41;
        }
        
        .goHome {
            background-color: #1e5631;
        }
        
        .psw {
            text-align: right;
            margin-bottom: 15px;
        }
        
        .psw a {
            color: #4CAF50;
            text-decoration: none;
        }
        
        hr {
            border: 1px solid #f1f1f1;
            margin: 15px 0;
        }
        
        .register {
            text-align: center;
            margin-top: 15px;
        }
        
        .register a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <form id="loginForm">
        <h1>تسجيل الدخول</h1>
        <div class="container">
            <input type="text" placeholder="البريد الإلكتروني أو اسم المستخدم" required>
            <input type="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الدخول</button>
            <span class="psw"><a href="#">نسيت كلمة المرور؟</a></span>
            <hr>
            <a href="home.html"><button type="button" class="goHome">الذهاب للصفحة الرئيسية</button></a>
            <p class="register">ليس لديك حساب؟ <a href="signup.html">إنشاء حساب</a></p>
        </div>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم تسجيل الدخول بنجاح!');
            window.location.href = 'home.html';
        });
    </script>
</body>

</html>
